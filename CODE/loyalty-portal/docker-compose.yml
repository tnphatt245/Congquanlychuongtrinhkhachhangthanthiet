version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: loyalty_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: loyalty_db
      MYSQL_USER: loyalty_user
      MYSQL_PASSWORD: loyalty_password
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: loyalty_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data: